<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Web 3D Playable</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        /* Crosshair di tengah layar */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }
        #crosshair::before {
            top: 5px; left: 0; width: 12px; height: 2px;
        }
        #crosshair::after {
            top: 0; left: 5px; width: 2px; height: 12px;
        }
        /* UI Overlay / Menu Utama */
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: white;
            text-align: center;
        }
        #instructions {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #55FF55;
            padding: 30px;
            border-radius: 8px;
            cursor: pointer;
            max-width: 500px;
        }
        h1 {
            color: #55FF55;
            font-size: 36px;
            margin-bottom: 15px;
            text-shadow: 2px 2px #000;
        }
        p {
            margin: 8px 0;
            font-size: 14px;
            color: #ccc;
        }
        .key {
            color: #FFF;
            font-weight: bold;
            background: #444;
            padding: 2px 6px;
            border-radius: 4px;
        }
        /* Hotbar Blok */
        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.5);
            padding: 6px;
            border-radius: 6px;
            border: 2px solid #333;
            z-index: 10;
        }
        .slot {
            width: 45px;
            height: 45px;
            border: 2px solid #555;
            background: #222;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 12px;
            border-radius: 4px;
        }
        .slot.active {
            border-color: #55FF55;
            background: #333;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>

    <div id="blocker">
        <div id="instructions">
            <h1>MINECRAFT WEB 3D</h1>
            <p style="font-size: 18px; color: #fff; margin-bottom: 20px;">Klik di sini untuk Memulai Game</p>
            <p><span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> : Berjalan</p>
            <p><span class="key">SPACE</span> : Melompat</p>
            <p><span class="key">MOUSE</span> : Mendorong Kamera Look</p>
            <p><span class="key">KLIK KIRI</span> : Hancurkan Blok</p>
            <p><span class="key">KLIK KANAN</span> : Pasang Blok</p>
            <p><span class="key">1</span> - <span class="key">4</span> : Pilih Jenis Blok</p>
            <p><span class="key">ESC</span> : Keluar Game / Menu</p>
        </div>
    </div>

    <div id="hotbar">
        <div class="slot active" id="slot-1">1: Rumput</div>
        <div class="slot" id="slot-2">2: Tanah</div>
        <div class="slot" id="slot-3">3: Batu</div>
        <div class="slot" id="slot-4">4: Kayu</div>
    </div>

    <div id="canvas-container"></div>

    <!-- Engine Three.js & PointerLockControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        // Setup Game Basic Engine
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Control FPS (Pointer Lock)
        const controls = new THREE.PointerLockControls(camera, document.body);
        const blocker = document.getElementById('blocker');
        const instructions = document.getElementById('instructions');

        instructions.addEventListener('click', () => { controls.lock(); });
        controls.addEventListener('lock', () => { blocker.style.display = 'none'; });
        controls.addEventListener('unlock', () => { blocker.style.display = 'flex'; });
        scene.add(controls.getObject());

        // Lampu
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Geometri & Material Blok
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const materials = {
            1: new THREE.MeshLambertMaterial({ color: 0x55a02e }), // Rumput
            2: new THREE.MeshLambertMaterial({ color: 0x866043 }), // Tanah
            3: new THREE.MeshLambertMaterial({ color: 0x808080 }), // Batu
            4: new THREE.MeshLambertMaterial({ color: 0x674d3c })  // Kayu
        };

        const objects = []; // Menyimpan semua objek untuk deteksi benturan & klik
        let selectedBlockType = 1;

        // Pembuatan Dunia (World Generation)
        const worldSize = 16;
        for (let x = -worldSize; x <= worldSize; x++) {
            for (let z = -worldSize; z <= worldSize; z++) {
                const height = Math.floor(Math.sin(x * 0.1) * Math.cos(z * 0.1) * 3) + 2;
                for (let y = 0; y <= height; y++) {
                    let type = 2; // Tanah
                    if (y === height) type = 1; // Rumput di atas
                    if (y < height - 2) type = 3; // Batu di bawah

                    const block = new THREE.Mesh(boxGeo, materials[type]);
                    block.position.set(x, y, z);
                    block.castShadow = true;
                    block.receiveShadow = true;
                    block.userData = { type: type };
                    scene.add(block);
                    objects.push(block);
                }
            }
        }

        // Posisi Awal Pemain
        controls.getObject().position.set(0, 10, 0);

        // Sistem Gerak & Fisika SEDERHANA
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let prevTime = performance.now();

        // Event Listener Input Keyboard
        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump) velocity.y += 12; canJump = false; break;
                case 'Digit1': selectSlot(1); break;
                case 'Digit2': selectSlot(2); break;
                case 'Digit3': selectSlot(3); break;
                case 'Digit4': selectSlot(4); break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        });

        function selectSlot(num) {
            selectedBlockType = num;
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
            document.getElementById(`slot-${num}`).classList.add('active');
        }

        // Raycaster untuk Hancurkan / Pasang Blok dengan Mouse
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(0, 0); // Selalu fokus tengah layar

        document.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects);

            if (intersects.length > 0) {
                const intersect = intersects[0];

                // Klik Kiri (0): Hancurkan Blok
                if (e.button === 0) {
                    scene.remove(intersect.object);
                    objects.splice(objects.indexOf(intersect.object), 1);
                } 
                // Klik Kanan (2): Pasang Blok
                else if (e.button === 2) {
                    const voxel = new THREE.Mesh(boxGeo, materials[selectedBlockType]);
                    voxel.position.copy(intersect.object.position).add(intersect.face.normal);
                    voxel.castShadow = true;
                    voxel.receiveShadow = true;
                    scene.add(voxel);
                    objects.push(voxel);
                }
            }
        });

        // Mencegah menu klik kanan bawaan browser muncul saat pasang blok
        document.addEventListener('contextmenu', e => e.preventDefault());

        // Game Loop / Render Loop
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            if (controls.isLocked) {
                const delta = (time - prevTime) / 1000;

                // Hambatan Gesek
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 30.0 * delta; // Gravitasi

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 50.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 50.0 * delta;

                // Kontrol Pergerakan Sederhana
                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                controls.getObject().position.y += (velocity.y * delta);

                // Deteksi Tanah Sederhana (Batas Jatuh minimal y = 5)
                if (controls.getObject().position.y < 5) {
                    velocity.y = 0;
                    controls.getObject().position.y = 5;
                    canJump = true;
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        animate();

        // Atur ulang ukuran layar saat di-resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
